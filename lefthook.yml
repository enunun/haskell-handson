# コミット時に，ステージしたファイルを検査する．
# CIは，同じ設定のツールをリポジトリ全体に対して実行する(mise run check)．
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    format:
      glob: '*.hs'
      run: ormolu --mode check {staged_files}
      fail_text: 整形が必要です．`mise run fmt`を実行してください．
    hlint:
      glob: '*.hs'
      run: hlint {staged_files}
      fail_text: hlintの指摘を直してください．
