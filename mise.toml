[tools]
rtk = "0.45.0"
lefthook = "2"
# GHC・cabal・HLSは，miseで入れたghcupがインストールする(tasks.toolchain)．
ghcup = "0.2.6.2"
hlint = "3.10"
ormolu = "0.8.1.1"
# 設計書のmermaidの図を検査する(tools/mermaid)ために使う．
node = "22"
# 版を固定する場合はここで`mise lock`を実行し，生成されたmise.lockもコミットする．

[settings]
lockfile = true

# ghcupで入れるツールの版．いずれもghcupの"recommended"に合わせる．
# HLSは，ここで選んだGHCに対応するビルドを含む版を選ぶ．
[vars]
ghc = "9.10.3"
cabal = "3.16.1.0"
hls = "2.14.0.0"

[tasks.toolchain]
description = "ghcupでGHC・cabal・HLSをインストールする(導入済みなら何もしない)"
run = [
	"ghcup install ghc {{vars.ghc}} --set",
	"ghcup install cabal {{vars.cabal}} --set",
	"ghcup install hls {{vars.hls}} --set",
]

[tasks.install]
description = "Hackageのパッケージ一覧を取得し，mermaidの検査に使うパッケージを入れる(Haskellの依存パッケージは初回のビルド時に入る)"
depends = ["toolchain"]
run = ["cabal update", "npm ci --prefix tools/mermaid --silent"]

[tasks.fmt]
description = "Haskellのコードを整形する"
depends = ["install"]
run = "git ls-files -z --cached --others --exclude-standard '*.hs' | xargs -0 -r ormolu --mode inplace"

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["install"]
run = [
	"git ls-files -z --cached --others --exclude-standard '*.hs' | xargs -0 -r ormolu --mode check",
	"git ls-files -z --cached --others --exclude-standard '*.hs' | xargs -0 -r hlint",
	"git ls-files -z --cached --others --exclude-standard '*.md' | xargs -0 -r node tools/mermaid/check.mjs",
]

[tasks.test]
description = "cabal.projectに登録したパッケージのテストを実行する"
depends = ["install"]
run = "cabal test all"

# 演習用パッケージは学習者がcabal.projectに登録する．保守用には，
# すべてのパッケージを並べたプロジェクトファイルを作ってテストする．
[tasks.test-all]
description = "演習用を含むすべてのパッケージをビルドし，テストを実行する(教材の保守用)"
depends = ["install"]
run = [
	"{ echo 'packages:'; for dir in iterations/*/*/; do echo \"  $dir\"; done; } > cabal.project.all",
	"cabal test all --project-file=cabal.project.all --builddir=dist-newstyle/all",
]

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(GHC・cabal・HLS，パッケージ一覧，Gitのフック)"
depends = ["install", "hooks"]

[tasks.check]
description = "整形の検査，リント，すべてのパッケージのテストをまとめて実行する"
depends = ["lint", "test-all"]
